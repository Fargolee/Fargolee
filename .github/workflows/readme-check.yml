name: Lint README

on:
  push:
    paths:
      - "README.md"
      - ".markdownlint.json"
  pull_request:
    paths:
      - "README.md"
      - ".markdownlint.json"

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "README.md"
